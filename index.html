<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشير - مطعم صاج رايز</title>
    <style>
        :root {
            --primary-orange: #ff7300;
            --dark-orange: #e06500;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --panel-bg: #252525;
            --text-light: #f5f5f5;
            --border-color: #333;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 12px; background-color: var(--bg-dark); color: var(--text-light); }
        
        header { 
            background: linear-gradient(135deg, var(--card-bg), #000); 
            color: white; 
            padding: 12px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            border: 1px solid var(--primary-orange);
            box-shadow: 0 4px 15px rgba(255, 115, 0, 0.2);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title h1 { margin: 0; font-size: 20px; color: var(--primary-orange); }
        .header-title span { font-size: 12px; color: #bbb; }

        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        .container { display: flex; gap: 12px; height: calc(100vh - 105px); }
        .panel { background: var(--panel-bg); border-radius: 12px; padding: 12px; border: 1px solid var(--border-color); }
        
        /* قسم الأصناف والتصنيفات */
        .products-panel { flex: 1.4; display: flex; flex-direction: column; gap: 10px; }
        .categories-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
        .tab-btn { 
            background: var(--card-bg); 
            color: var(--text-light); 
            border: 1px solid var(--border-color); 
            padding: 8px 14px; 
            border-radius: 20px; 
            cursor: pointer; 
            white-space: nowrap;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }
        .tab-btn.active, .tab-btn:hover { background: var(--primary-orange); color: #000; border-color: var(--primary-orange); }

        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); 
            gap: 8px; 
            overflow-y: auto; 
            padding: 4px; 
        }

        .product-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            padding: 10px 6px; 
            border-radius: 8px; 
            cursor: pointer; 
            text-align: center; 
            font-weight: bold; 
            font-size: 13px; 
            color: var(--text-light); 
            transition: 0.2s; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 80px;
        }
        .product-card:hover { border-color: var(--primary-orange); transform: translateY(-2px); }
        .product-card span { color: var(--primary-orange); font-size: 13px; margin-top: 4px; }

        /* قسم الفاتورة */
        .cart-panel { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .cart-items-wrapper { flex: 1; overflow-y: auto; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); }
        
        .cart-table { width: 100%; border-collapse: collapse; }
        .cart-table th, .cart-table td { border-bottom: 1px solid var(--border-color); padding: 8px 4px; text-align: right; }
        .cart-table th { color: var(--primary-orange); font-size: 13px; }

        .item-note-input {
            width: 100%;
            margin-top: 4px;
            padding: 4px 8px;
            background: #181818;
            border: 1px solid #444;
            border-radius: 4px;
            color: #ffb703;
            font-size: 11px;
        }
        .item-note-input::placeholder { color: #777; }

        .summary-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; }
        .summary-line { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
        .old-price { text-decoration: line-through; color: #ef4444; }
        .final-price { font-size: 17px; font-weight: bold; color: var(--primary-orange); border-top: 1px dashed var(--border-color); padding-top: 5px; margin-top: 4px; }

        .actions { display: flex; gap: 8px; margin-top: 8px; }
        .btn { padding: 10px 12px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-orange { background: var(--primary-orange); color: #000; }
        .btn-orange:hover { background: var(--dark-orange); }
        .btn-purple { background: #8b5cf6; color: white; }
        .btn-secondary { background: var(--card-bg); color: white; border: 1px solid var(--border-color); }
        .btn-danger { background: #ef4444; color: white; width: 22px; height: 22px; padding: 0; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }

        /* Popups / Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--primary-orange); border-radius: 12px; padding: 20px; width: 90%; max-width: 420px; box-shadow: 0 5px 25px rgba(0,0,0,0.7); }
        .modal-header { font-size: 17px; font-weight: bold; color: var(--primary-orange); margin-bottom: 15px; text-align: center; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #ccc; }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 10px; 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            color: white; 
            border-radius: 8px; 
            font-size: 13px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary-orange); }

        @media print {
            body * { visibility: hidden; }
            #receipt-print, #receipt-print * { visibility: visible; }
            #receipt-print { position: absolute; left: 0; top: 0; width: 80mm; font-family: monospace; font-size: 12px; color: black; background: white; padding: 10px; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<header class="no-print">
    <div class="header-title">
        <h1>مطعم صاج رايز</h1>
        <span>نظام الكاشير المطور</span>
    </div>
    <div class="header-actions">
        <span style="font-size:13px;">المستخدم: <strong id="current-user-name" style="color:var(--primary-orange)">-</strong> (<span id="user-role-label">-</span>)</span>
        <button onclick="openLoginModal()" class="btn btn-secondary">دخول / الشفتات</button>
        <button onclick="openPassModal()" class="btn btn-secondary">تغيير السر</button>
        <button onclick="openReportsModal()" class="btn btn-purple">الجرد والتقارير</button>
    </div>
</header>

<div class="container no-print">
    <!-- قائمة الأصناف -->
    <div class="panel products-panel">
        <div class="categories-tabs" id="categories-tabs"></div>
        <div class="products-grid" id="products-list"></div>
    </div>

    <!-- الفاتورة -->
    <div class="panel cart-panel">
        <h3 style="margin-top:0; color:var(--primary-orange); font-size: 16px;">تفاصيل الطلب</h3>
        <div class="cart-items-wrapper">
            <table class="cart-table">
                <thead>
                    <tr><th>الصنف والتفاصيل</th><th style="width: 60px;">السعر</th><th style="width: 30px;"></th></tr>
                </thead>
                <tbody id="cart-rows"></tbody>
            </table>
        </div>

        <div class="summary-box">
            <div class="summary-line">
                <span>المجموع الأصلي:</span>
                <span id="subtotal-val">0.00</span>
            </div>
            <div class="summary-line" id="discount-row" style="display: none; color: #ef4444;">
                <span>الخصم:</span>
                <span id="discount-val">-0.00</span>
            </div>
            <div class="summary-line final-price">
                <span>الصافي النهائي:</span>
                <span id="total-val">0.00 د.أ</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-purple" style="flex:1" onclick="applyDiscount()">خصم (Admin)</button>
            <button class="btn btn-orange" style="flex:2" onclick="processOrder()">طباعة الفاتورة</button>
        </div>
    </div>
</div>

<!-- Modal: Login -->
<div id="login-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">تسجيل الدخول اختيار الشفت</div>
        <div class="form-group">
            <label>اختر الحساب / الشفت</label>
            <select id="login-email">
                <option value="admin@sajrise.com">المدير العام (Admin)</option>
                <option value="morning@sajrise.com">كاشير - شفت صباحي</option>
                <option value="evening@sajrise.com">كاشير - شفت مسائي</option>
            </select>
        </div>
        <div class="form-group">
            <label>كلمة السر</label>
            <input type="password" id="login-password" placeholder="أدخل كلمة السر">
        </div>
        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <button onclick="submitLogin()" class="btn btn-orange" style="flex:1">دخول</button>
            <button onclick="closeModal('login-modal')" class="btn btn-secondary" style="flex:1">إلغاء</button>
        </div>
    </div>
</div>

<!-- Modal: Change Password -->
<div id="pass-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">تغيير كلمة السر</div>
        <div class="form-group">
            <label>البريد الإلكتروني للحساب</label>
            <input type="email" id="pass-email" readonly style="opacity: 0.7;">
        </div>
        <div class="form-group">
            <label>كلمة السر الحالية</label>
            <input type="password" id="pass-old" placeholder="كلمة السر القديمة">
        </div>
        <div class="form-group">
            <label>كلمة السر الجديدة</label>
            <input type="password" id="pass-new" placeholder="كلمة السر الجديدة">
        </div>
        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <button onclick="submitChangePassword()" class="btn btn-orange" style="flex:1">حفظ</button>
            <button onclick="closeModal('pass-modal')" class="btn btn-secondary" style="flex:1">إلغاء</button>
        </div>
    </div>
</div>

<!-- Modal: Reports & Monthly Inventory -->
<div id="reports-modal" class="modal">
    <div class="modal-content" style="max-width: 550px;">
        <div class="modal-header">لوحة التقارير والجرد</div>
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <button onclick="showDailyReport()" class="btn btn-orange" style="flex:1">تقرير اليوم / الشفت</button>
            <button onclick="showMonthlyReport()" class="btn btn-purple" style="flex:1">الجرد الشهري</button>
        </div>
        <div id="report-output" style="background: var(--card-bg); padding: 12px; border-radius: 8px; max-height: 220px; overflow-y: auto; font-size: 13px; line-height: 1.6; border: 1px solid var(--border-color);">
            اختر نوع التقرير لعرض الإحصائيات...
        </div>
        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <button onclick="printReport()" class="btn btn-orange" style="flex:1">طباعة التقرير</button>
            <button onclick="closeModal('reports-modal')" class="btn btn-secondary" style="flex:1">إغلاق</button>
        </div>
    </div>
</div>

<div id="receipt-print" style="display: none;"></div>

<script>
    const menuData = {
        "وجبات صاج": [
            { name: "وجبة صاج عادي", price: 2.25 },
            { name: "وجبة صاج سوبر", price: 3.00 },
            { name: "وجبة صاج دبل", price: 3.50 },
            { name: "وجبة صاج تربل", price: 4.75 },
            { name: "وجبة حلبي صاج", price: 3.50 },
            { name: "وجبة ايطالي صاج", price: 3.00 },
            { name: "وجبة ايطالي بالكريمة", price: 3.50 },
            { name: "وجبة فرنسي صاج", price: 2.75 }
        ],
        "شاورما عادي": [
            { name: "وجبة شاورما عادي", price: 1.75 },
            { name: "وجبة شاورما سوبر", price: 2.40 },
            { name: "وجبة شاورما دبل", price: 3.00 },
            { name: "وجبة شاورما تربل", price: 4.00 },
            { name: "وجبة طحينية وبصل عادي", price: 1.75 },
            { name: "وجبة طحينية وبصل سوبر", price: 2.40 },
            { name: "ساندويش عادي", price: 0.75 },
            { name: "ساندويش سوبر", price: 1.10 },
            { name: "خرطوشة", price: 0.75 }
        ],
        "سدر شاورما": [
            { name: "سدر عائلي صغير", price: 5.50 },
            { name: "سدر عائلي وسط", price: 8.00 },
            { name: "سدر عائلي كبير", price: 15.00 },
            { name: "نص اوقية حاف", price: 1.75 },
            { name: "اوقية شاورما حاف", price: 3.50 },
            { name: "كيلو شاورما حاف", price: 12.00 }
        ],
        "بروستد وكرسبي": [
            { name: "نصف دجاجة بروستد", price: 3.25 },
            { name: "دجاجة بروستد كاملة", price: 6.50 },
            { name: "وجبة عائلية بروستد", price: 10.50 },
            { name: "وجبة العملاق بروستد", price: 14.00 },
            { name: "كرسبي 4 قطع", price: 2.75 },
            { name: "كرسبي 8 قطع", price: 5.00 },
            { name: "كرسبي 12 قطعة", price: 7.25 },
            { name: "كرسبي 16 قطعة", price: 9.50 }
        ],
        "برجر و سناك": [
            { name: "وجبة تشكن فرايز", price: 2.50 },
            { name: "وجبة صحية", price: 3.00 },
            { name: "فولكانو فرايز", price: 3.00 },
            { name: "وجبة زنجر", price: 2.50 },
            { name: "وجبة زنجر بالكريمة", price: 2.75 },
            { name: "وجبة برجر دجاج", price: 2.75 },
            { name: "وجبة برجر لحم", price: 3.75 },
            { name: "ساندويش زنجر", price: 1.50 },
            { name: "ساندويش برجر دجاج", price: 1.75 }
        ],
        "مقبلات ومشروبات": [
            { name: "بطاطا صغير", price: 0.50 },
            { name: "بطاطا كبير", price: 1.00 },
            { name: "بطاطا ودجز كبير", price: 1.50 },
            { name: "مشروب غازي 250مل", price: 0.25 },
            { name: "لبن عيران", price: 0.50 },
            { name: "علبة مثومة", price: 0.50 },
            { name: "علبة صوص رايز", price: 1.00 }
        ]
    };

    const defaultUsers = {
        "admin@sajrise.com": { name: "المدير العام", role: "Admin", pass: "1234" },
        "morning@sajrise.com": { name: "كاشير الصباحي", role: "Cashier", pass: "1111" },
        "evening@sajrise.com": { name: "كاشير المسائي", role: "Cashier", pass: "2222" }
    };

    let users = JSON.parse(localStorage.getItem('sajrise_users')) || defaultUsers;
    let currentUser = users["morning@sajrise.com"];
    let currentUserEmail = "morning@sajrise.com";
    let salesHistory = JSON.parse(localStorage.getItem('sajrise_sales')) || [];

    let cart = [];
    let discountAmount = 0;

    function saveUsers() { localStorage.setItem('sajrise_users', JSON.stringify(users)); }
    function saveSales() { localStorage.setItem('sajrise_sales', JSON.stringify(salesHistory)); }

    function updateHeaderUser() {
        document.getElementById('current-user-name').innerText = currentUser.name;
        document.getElementById('user-role-label').innerText = currentUser.role === "Admin" ? "مدير بالنظام" : "كاشير";
    }

    function initCategories() {
        const tabsContainer = document.getElementById('categories-tabs');
        tabsContainer.innerHTML = '';
        let first = true;
        
        for (let cat in menuData) {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${first ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderProducts(cat);
            };
            tabsContainer.appendChild(btn);
            if (first) { renderProducts(cat); first = false; }
        }
    }

    function renderProducts(category) {
        const container = document.getElementById('products-list');
        container.innerHTML = '';
        menuData[category].forEach(p => {
            container.innerHTML += `
                <div class="product-card" onclick="addToCart('${p.name}', ${p.price})">
                    <div>${p.name}</div>
                    <span>${p.price.toFixed(2)} د.أ</span>
                </div>
            `;
        });
    }

    function addToCart(name, price) {
        cart.push({ name, price, note: "" });
        updateCartUI();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    function updateItemNote(index, value) {
        cart[index].note = value;
    }

    function updateCartUI() {
        const tbody = document.getElementById('cart-rows');
        tbody.innerHTML = '';
        let subtotal = 0;

        cart.forEach((item, index) => {
            subtotal += item.price;
            tbody.innerHTML += `
                <tr>
                    <td>
                        <strong>${item.name}</strong>
                        <input type="text" class="item-note-input" placeholder="ملاحظة للطلب (مثال: بدون مايونيز)" 
                               value="${item.note}" oninput="updateItemNote(${index}, this.value)">
                    </td>
                    <td style="vertical-align: top; padding-top:10px;">${item.price.toFixed(2)}</td>
                    <td style="vertical-align: top; padding-top:8px;"><button class="btn-danger" onclick="removeFromCart(${index})">×</button></td>
                </tr>
            `;
        });

        let total = Math.max(0, subtotal - discountAmount);
        const subtotalEl = document.getElementById('subtotal-val');
        subtotalEl.innerText = subtotal.toFixed(2);
        
        if (discountAmount > 0) {
            subtotalEl.classList.add('old-price');
            document.getElementById('discount-row').style.display = 'flex';
            document.getElementById('discount-val').innerText = `-${discountAmount.toFixed(2)}`;
        } else {
            subtotalEl.classList.remove('old-price');
            document.getElementById('discount-row').style.display = 'none';
        }

        document.getElementById('total-val').innerText = total.toFixed(2) + " د.أ";
    }

    function applyDiscount() {
        if (currentUser.role !== "Admin") {
            alert("عذراً، الخصم مسموح به لحساب المدير فقط!");
            return;
        }
        let val = parseFloat(prompt("أدخل قيمة الخصم (بالدينار):"));
        if (!isNaN(val) && val >= 0) {
            discountAmount = val;
            updateCartUI();
        }
    }

    function processOrder() {
        if (cart.length === 0) {
            alert("السلة فارغة!");
            return;
        }

        let subtotal = cart.reduce((a, b) => a + b.price, 0);
        let total = Math.max(0, subtotal - discountAmount);
        let timestamp = new Date().toISOString();

        salesHistory.push({
            id: Date.now(),
            date: timestamp,
            cashier: currentUser.name,
            items: JSON.parse(JSON.stringify(cart)),
            subtotal,
            discount: discountAmount,
            total
        });
        saveSales();

        let printHTML = `
            <div style="text-align: center; width: 100%;">
                <h2 style="margin: 3px 0;">مطعم صاج رايز</h2>
                <p style="margin: 2px 0;">معان - مجمع عامر القرامسة</p>
                <p style="margin: 2px 0;">هاتف: 0782542024</p>
                <p style="margin: 2px 0;">التاريخ: ${new Date().toLocaleString('ar-JO')}</p>
                <p style="margin: 2px 0;">الكاشير: ${currentUser.name}</p>
                <p>--------------------------------</p>
            </div>
            <table style="width: 100%; font-size: 12px; text-align: right;">
        `;

        cart.forEach(item => {
            printHTML += `
                <tr>
                    <td>
                        <strong>${item.name}</strong>
                        ${item.note ? `<br><small style="font-size:10px; padding-right:8px;">* ${item.note}</small>` : ''}
                    </td>
                    <td style="text-align:left; vertical-align:top;">${item.price.toFixed(2)}</td>
                </tr>
            `;
        });

        printHTML += `</table><p>--------------------------------</p>`;

        if (discountAmount > 0) {
            printHTML += `
                <div>المجموع الأصلي: <span style="text-decoration: line-through;">${subtotal.toFixed(2)}</span></div>
                <div>الخصم: -${discountAmount.toFixed(2)}</div>
                <div style="font-weight: bold; font-size: 15px; margin-top: 4px;">الصافي: ${total.toFixed(2)} د.أ</div>
            `;
        } else {
            printHTML += `<div style="font-weight: bold; font-size: 15px;">المجموع الكلي: ${total.toFixed(2)} د.أ</div>`;
        }

        printHTML += `<p style="text-align: center; margin-top: 15px;">شكراً لزيارتكم - صاج رايز</p>`;

        const receiptContainer = document.getElementById('receipt-print');
        receiptContainer.innerHTML = printHTML;
        receiptContainer.style.display = 'block';

        window.print();

        receiptContainer.style.display = 'none';
        cart = [];
        discountAmount = 0;
        updateCartUI();
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function openLoginModal() { openModal('login-modal'); }
    function submitLogin() {
        let email = document.getElementById('login-email').value;
        let pass = document.getElementById('login-password').value;

        if (users[email] && users[email].pass === pass) {
            currentUser = users[email];
            currentUserEmail = email;
            updateHeaderUser();
            closeModal('login-modal');
            document.getElementById('login-password').value = '';
        } else {
            alert("كلمة السر غير صحيحة!");
        }
    }

    function openPassModal() {
        document.getElementById('pass-email').value = currentUserEmail;
        openModal('pass-modal');
    }

    function submitChangePassword() {
        let oldPass = document.getElementById('pass-old').value;
        let newPass = document.getElementById('pass-new').value;

        if (currentUser.pass !== oldPass) {
            alert("كلمة السر الحالية غير صحيحة!");
            return;
        }

        if (!newPass) {
            alert("يرجى أدخل كلمة سر جديدة!");
            return;
        }

        users[currentUserEmail].pass = newPass;
        saveUsers();
        alert("تم تغيير كلمة السر بنجاح!");
        closeModal('pass-modal');
        document.getElementById('pass-old').value = '';
        document.getElementById('pass-new').value = '';
    }

    function openReportsModal() { openModal('reports-modal'); }

    function showDailyReport() {
        let todayStr = new Date().toISOString().split('T')[0];
        let todaySales = salesHistory.filter(s => s.date.startsWith(todayStr));
        
        let totalSum = todaySales.reduce((acc, curr) => acc + curr.total, 0);
        let count = todaySales.length;

        let html = `<strong>تقرير مبيعات اليوم (${todayStr}):</strong><br>`;
        html += `عدد الطلبات: <strong>${count}</strong><br>`;
        html += `إجمالي المبيعات: <strong style="color:var(--primary-orange)">${totalSum.toFixed(2)} د.أ</strong><hr style="border-color:#444;">`;
        
        todaySales.forEach((s, i) => {
            html += `<small>#${i+1} [${s.cashier}] - الصافي: ${s.total.toFixed(2)} د.أ</small><br>`;
        });

        document.getElementById('report-output').innerHTML = html;
    }

    function showMonthlyReport() {
        let currentMonth = new Date().toISOString().slice(0, 7);
        let monthSales = salesHistory.filter(s => s.date.startsWith(currentMonth));

        let totalSum = monthSales.reduce((acc, curr) => acc + curr.total, 0);
        let count = monthSales.length;

        let html = `<strong>الجرد الشهري (${currentMonth}):</strong><br>`;
        html += `إجمالي الطلبات خلال الشهر: <strong>${count}</strong><br>`;
        html += `إجمالي الدخل المالي للشهر: <strong style="color:var(--primary-orange)">${totalSum.toFixed(2)} د.أ</strong>`;

        document.getElementById('report-output').innerHTML = html;
    }

    function printReport() {
        let reportContent = document.getElementById('report-output').innerHTML;
        const receiptContainer = document.getElementById('receipt-print');
        receiptContainer.innerHTML = `<div style="padding:10px;"><h3>تقرير صاج رايز</h3>${reportContent}</div>`;
        receiptContainer.style.display = 'block';
        window.print();
        receiptContainer.style.display = 'none';
    }

    updateHeaderUser();
    initCategories();
</script>

</body>
</html>
