<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشير الريس - POS System</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 15px; background-color: #f0f2f5; }
        
        /* الهيدر وشاشة تسجيل الدخول */
        header { background: #1e293b; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 15px; }
        .user-info { display: flex; gap: 15px; align-items: center; }
        
        /* التنسيق الرئيسي */
        .container { display: flex; gap: 15px; height: calc(100vh - 100px); }
        .panel { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        
        /* قائمة الوجبات */
        .products-panel { flex: 1.2; overflow-y: auto; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
        .product-card { background: #e2e8f0; border: none; padding: 15px 10px; border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; font-size: 15px; color: #0f172a; transition: 0.2s; }
        .product-card:hover { background: #cbd5e1; transform: translateY(-2px); }
        .product-card span { display: block; color: #2563eb; font-size: 13px; margin-top: 5px; }
        
        /* الفاتورة */
        .cart-panel { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        .cart-table th, .cart-table td { border-bottom: 1px solid #e2e8f0; padding: 8px; text-align: right; }
        .cart-items-wrapper { flex: 1; overflow-y: auto; }
        
        /* الحسابات والأسعار */
        .summary-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; margin-top: 10px; }
        .summary-line { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 15px; }
        .old-price { text-decoration: line-through; color: #ef4444; }
        .final-price { font-size: 20px; font-weight: bold; color: #16a34a; }
        
        /* الأزرار */
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-discount { background: #8b5cf6; color: white; }
        .btn-print { background: #16a34a; color: white; }
        .btn-danger { background: #ef4444; color: white; width: 30px; height: 30px; padding: 0; border-radius: 4px; }
        
        /* تنسيق الطباعة الحرارية */
        @media print {
            body * { visibility: hidden; }
            #receipt-print, #receipt-print * { visibility: visible; }
            #receipt-print { position: absolute; left: 0; top: 0; width: 80mm; font-family: monospace; font-size: 12px; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<header class="no-print">
    <h1>كاشير الريس</h1>
    <div class="user-info">
        <span>المستخدم: <strong id="current-user">كاشير</strong> (<span id="user-role">صلاحيات محدودة</span>)</span>
        <button onclick="switchUser()" style="padding: 5px 10px; cursor: pointer;">تغيير المستخدم</button>
    </div>
</header>

<div class="container no-print">
    <!-- قائمة المنتجات -->
    <div class="panel products-panel">
        <h3>قائمة الوجبات والساندويشات</h3>
        <div class="products-grid" id="products-list"></div>
    </div>

    <!-- الفاتورة والتفاصيل -->
    <div class="panel cart-panel">
        <h3>الفاتورة الحالية</h3>
        <div class="cart-items-wrapper">
            <table class="cart-table">
                <thead>
                    <tr><th>الصنف</th><th>السعر</th><th>إجراء</th></tr>
                </thead>
                <tbody id="cart-rows"></tbody>
            </table>
        </div>

        <div class="summary-box">
            <div class="summary-line">
                <span>المجموع الأصلي:</span>
                <span id="subtotal-val">0.00</span>
            </div>
            <div class="summary-line" id="discount-row" style="display: none; color: #ef4444;">
                <span>الخصم:</span>
                <span id="discount-val">-0.00</span>
            </div>
            <hr>
            <div class="summary-line final-price">
                <span>الصافي النهائي:</span>
                <span id="total-val">0.00</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-discount" onclick="handleDiscount()">إضافة خصم</button>
            <button class="btn btn-print" onclick="processOrder()">طباعة وقص الورقة</button>
        </div>
    </div>
</div>

<!-- القالب المخصص للطباعة فقط -->
<div id="receipt-print" style="display: none;"></div>

<script>
    // المنتجات الافتراضية
    const products = [
        { id: 1, name: "وجبة شاورما", price: 3.50 },
        { id: 2, name: "ساندويش برغر", price: 2.50 },
        { id: 3, name: "وجبة دجاج", price: 4.50 },
        { id: 4, name: "بطاطا حجم كبير", price: 1.20 },
        { id: 5, name: "عصير طازج", price: 1.00 }
    ];

    let cart = [];
    let discountAmount = 0;
    let currentUser = { name: "كاشير", role: "Cashier" };
    const ADMIN_PIN = "1234";

    // تحميل المنتجات
    function renderProducts() {
        const container = document.getElementById('products-list');
        container.innerHTML = '';
        products.forEach(p => {
            container.innerHTML += `
                <button class="product-card" onclick="addToCart('${p.name}', ${p.price})">
                    ${p.name}
                    <span>${p.price.toFixed(2)} د.أ</span>
                </button>
            `;
        });
    }

    function addToCart(name, price) {
        cart.push({ name, price });
        updateCartUI();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    function updateCartUI() {
        const tbody = document.getElementById('cart-rows');
        tbody.innerHTML = '';
        let subtotal = 0;

        cart.forEach((item, index) => {
            subtotal += item.price;
            tbody.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.price.toFixed(2)}</td>
                    <td><button class="btn-danger" onclick="removeFromCart(${index})">×</button></td>
                </tr>
            `;
        });

        let total = Math.max(0, subtotal - discountAmount);

        const subtotalEl = document.getElementById('subtotal-val');
        subtotalEl.innerText = subtotal.toFixed(2);
        
        if (discountAmount > 0) {
            subtotalEl.classList.add('old-price');
            document.getElementById('discount-row').style.display = 'flex';
            document.getElementById('discount-val').innerText = `-${discountAmount.toFixed(2)}`;
        } else {
            subtotalEl.classList.remove('old-price');
            document.getElementById('discount-row').style.display = 'none';
        }

        document.getElementById('total-val').innerText = total.toFixed(2);
    }

    // إضافة الخصم بالصلاحيات
    function handleDiscount() {
        if (currentUser.role === "Cashier") {
            let pin = prompt("أدخل كلمة سر المشرف لعمل الخصم:");
            if (pin !== ADMIN_PIN) {
                alert("كلمة السر خاطئة! الخصم متاح للمشرفين فقط.");
                return;
            }
        }
        
        let val = parseFloat(prompt("أدخل قيمة الخصم:"));
        if (!isNaN(val) && val >= 0) {
            discountAmount = val;
            updateCartUI();
        }
    }

    // تغيير بين الكاشير والمدير
    function switchUser() {
        let pin = prompt("أدخل كلمة السر (1234 للمدير / 1111 للكاشير):");
        if (pin === "1234") {
            currentUser = { name: "المدير", role: "Admin" };
        } else if (pin === "1111") {
            currentUser = { name: "كاشير 1", role: "Cashier" };
        } else {
            alert("كلمة السر غير صحيحة!");
            return;
        }
        document.getElementById('current-user').innerText = currentUser.name;
        document.getElementById('user-role').innerText = currentUser.role === "Admin" ? "مدير بالنظام" : "صلاحيات محدودة";
    }

    // إصدار أمر الطباعة
    function processOrder() {
        if (cart.length === 0) {
            alert("السلة فارغة!");
            return;
        }

        let subtotal = cart.reduce((a, b) => a + b.price, 0);
        let total = Math.max(0, subtotal - discountAmount);

        let printHTML = `
            <div style="text-align: center; width: 100%;">
                <h2 style="margin: 5px 0;">مطعم كاشير الريس</h2>
                <p style="margin: 2px 0;">فاتورة مبيعات - ${new Date().toLocaleTimeString('ar-EG')}</p>
                <p style="margin: 2px 0;">الكاشير: ${currentUser.name}</p>
                <p>--------------------------------</p>
            </div>
            <table style="width: 100%; font-size: 12px; text-align: right;">
        `;

        cart.forEach(item => {
            printHTML += `<tr><td>${item.name}</td><td style="text-align:left">${item.price.toFixed(2)}</td></tr>`;
        });

        printHTML += `</table><p>--------------------------------</p><div style="font-size: 13px;">`;

        if (discountAmount > 0) {
            printHTML += `
                <div>السعر الأصلي: <span style="text-decoration: line-through;">${subtotal.toFixed(2)}</span></div>
                <div>الخصم: -${discountAmount.toFixed(2)}</div>
                <div style="font-weight: bold; font-size: 15px;">السعر الجديد: ${total.toFixed(2)} د.أ</div>
            `;
        } else {
            printHTML += `<div style="font-weight: bold; font-size: 15px;">المجموع الكلي: ${total.toFixed(2)} د.أ</div>`;
        }

        printHTML += `</div><p style="text-align: center; margin-top: 15px;">شكراً لزيارتكم!</p>`;

        const receiptContainer = document.getElementById('receipt-print');
        receiptContainer.innerHTML = printHTML;
        receiptContainer.style.display = 'block';

        // أمر الطباعة
        window.print();

        // إعادة ضبط السلة بعد الطباعة
        receiptContainer.style.display = 'none';
        cart = [];
        discountAmount = 0;
        updateCartUI();
    }

    renderProducts();
</script>

</body>
</html>
