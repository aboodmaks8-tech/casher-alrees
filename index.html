<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام كاشير الريس المتطور</title>
  <style>
    /* --- تنسيقات التصميم بالأزرق السماوي والأبيض --- */
    :root {
      --bg-primary: #e0f2fe;
      --bg-card: #ffffff;
      --bg-accent: #0284c7;
      --text-main: #0c4a6e;
      --border-color: #bae6fd;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 15px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .btn {
      background: var(--bg-accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 15px;
    }

    .panel {
      background: var(--bg-card);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .meals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .meal-card {
      background: #f0f9ff;
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f0f9ff;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
    }

    .qty-input {
      width: 50px;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px;
      font-weight: bold;
    }

    /* --- النافذة المنبثقة (الاشتراكات) --- */
    .modal-overlay {
      display: none; /* مخفية افتراضياً حتى لا تخرب الصفحة */
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(12, 74, 110, 0.5);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      border: 2px solid var(--border-color);
    }

    .whatsapp-btn {
      background: #25d366;
      color: white;
      text-decoration: none;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- شريط العناوين العلوية -->
  <div class="top-bar">
    <h2>🌸 نظام كاشير الريس المتطور</h2>
    <button class="btn" onclick="openModal()">الاشتراكات</button>
  </div>

  <!-- المحتوى الرئيسي -->
  <div class="main-grid">
    <!-- الفاتورة والحساب -->
    <div class="panel">
      <h3>الفاتورة</h3>
      <div id="cartItems"></div>
      <hr style="border-color: var(--border-color);">
      <h4>المجموع النهائى: <span id="totalPrice">0.000</span> د.أ</h4>
    </div>

    <!-- قائمة الوجبات -->
    <div class="panel">
      <h3>الوجبات</h3>
      <div class="meals-grid">
        <div class="meal-card" onclick="addToCart('وجبة الريس', 2.500)">
          وجبة الريس<br><small>2.500 د.أ</small>
        </div>
        <div class="meal-card" onclick="addToCart('وجبة صاج دجاج', 3.000)">
          وجبة صاج دجاج<br><small>3.000 د.أ</small>
        </div>
      </div>
    </div>
  </div>

  <!-- نافذة الاشتراكات والتواصل -->
  <div id="subModal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="color: #0284c7; margin: 0 0 10px 0;">باقات الاشتراكات</h3>
      <p style="margin: 5px 0;">اسم الموقع: <strong>naks8-tech</strong></p>
      <p style="margin: 5px 0;">رقم التواصل: <span dir="ltr">+9627XXXXXXXX</span></p>
      
      <a id="waLink" href="#" target="_blank" class="whatsapp-btn">تواصل مباشر عبر الواتساب 💬</a>
      <br><br>
      <button class="btn" style="background: #64748b;" onclick="closeModal()">إغلاق</button>
    </div>
  </div>

  <script>
    // --- إعدادات النافذة المنبثقة ---
    function openModal() {
      const phone = "9627XXXXXXXX"; // ضع رقم الواتساب هنا
      const msg = encodeURIComponent("مرحباً، أرغب بالاستفسار عن اشتراكات موقع naks8-tech");
      document.getElementById('waLink').href = `https://wa.me/${phone}?text=${msg}`;
      document.getElementById('subModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('subModal').style.display = 'none';
    }

    // --- إدار الفاتورة وتعديل الكمية ---
    let cart = [];

    function addToCart(name, price) {
      let item = cart.find(i => i.name === name);
      if (item) {
        item.qty++;
      } else {
        cart.push({ name, price, qty: 1 });
      }
      renderCart();
    }

    function updateQty(index, newQty) {
      let q = parseInt(newQty);
      cart[index].qty = (isNaN(q) || q < 1) ? 1 : q;
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      container.innerHTML = '';
      let total = 0;

      cart.forEach((item, i) => {
        let itemTotal = item.price * item.qty;
        total += itemTotal;
        container.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              <small>${item.price.toFixed(3)} د.أ</small>
            </div>
            <div>
              الكمية: 
              <input type="number" class="qty-input" value="${item.qty}" min="1" onchange="updateQty(${i}, this.value)">
            </div>
            <div><strong>${itemTotal.toFixed(3)}</strong></div>
          </div>
        `;
      });

      document.getElementById('totalPrice').innerText = total.toFixed(3);
    }
  </script>
</body>
</html>
