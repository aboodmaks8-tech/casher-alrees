        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #receipt-print-area, #receipt-print-area * { visibility: visible; }
            #receipt-print-area {
                position: absolute; left: 0; top: 0; width: 80mm; padding: 5mm; font-size: 12px; color: black;
            }
            .no-print { display: none !important; }
        }
        .category-tab.active {
            background-color: #f97316;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.3);

</head>

    </aside>

    <!-- المنطقة الرئيسية -->

            <div class="flex gap-2 border-b border-slate-200 pb-3 mb-4 overflow-x-auto no-print" id="categories-tabs"></div>

            <!-- شبكة أصناف القسم المختار -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3" id="products-grid"></div>
        </section>

        <!-- قسم الفاتورة -->
        <section class="w-96 bg-white border-r border-slate-200 flex flex-col shadow-xl">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="font-bold text-lg text-slate-800">الفاتورة الحالية</h2>
                <button onclick="clearCart()" class="text-xs text-red-500 font-semibold px-2 py-1 border border-red-200 rounded hover:bg-red-50">تفريغ السلة</button>
            </div>
            
            <!-- قائمة عناصر الفاتورة مع التعديل والملاحظات وحذف الصنف -->
            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="cart-items"></div>

            <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
                <div class="flex justify-between text-xl font-bold border-t pt-2">
                    <span>الإجمالي:</span>
                    <span id="total" class="text-orange-600">0.000 د.أ</span>
                </div>
                
                <div class="grid grid-cols-2 gap-2 no-print">
                    <button onclick="processPayment()" class="py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-lg shadow-orange-500/30 text-base transition flex items-center justify-center gap-2">

                    <button onclick="clearCart()" class="py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-base transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-trash-can"></i> إغلاق / إلغاء
                    </button>
                </div>
            </div>
        </section>
    </main>

        function renderCategories() {
            const container = document.getElementById('categories-tabs');
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat}')" class="category-tab ${cat === currentCategory ? 'active' : 'bg-white text-slate-700 border-slate-200'} px-5 py-2.5 rounded-xl text-sm font-bold border transition whitespace-nowrap">
                    ${cat}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const filtered = products.filter(p => p.category === currentCategory);
            
            grid.innerHTML = filtered.map(p => `
                <div onclick="addToCart(${p.id})" class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm cursor-pointer hover:border-orange-500 hover:shadow-md transition flex flex-col justify-between">
                    <h3 class="font-bold text-slate-800 text-sm leading-tight">${p.name}</h3>
                    <p class="text-orange-600 font-extrabold text-base mt-2">${p.price.toFixed(2)} د.أ</p>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const p = products.find(prod => prod.id === id);
            cart.push({
                cartItemId: Date.now() + Math.random(),
                id: p.id,
                name: p.name,
                price: p.price,
                qty: 1,
                note: ""
            });
            updateCart();
        }

        function changeQty(cartItemId, delta) {
            const item = cart.find(i => i.cartItemId === cartItemId);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    deleteCartItem(cartItemId);
                    return;
                }
            }
            updateCart();
        }

        function updateNote(cartItemId, noteText) {
            const item = cart.find(i => i.cartItemId === cartItemId);
            if (item) {
                item.note = noteText;
            }
        }

        function deleteCartItem(cartItemId) {
            cart = cart.filter(i => i.cartItemId !== cartItemId);
            updateCart();
        }

        function clearCart() { cart = []; updateCart(); }

        function updateCart() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 font-bold text-sm">السلة فارغة</div>`;

                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="font-bold text-sm text-slate-800">${i.name}</div>
                                <div class="text-xs text-orange-600 font-bold">${i.price.toFixed(2)} د.أ</div>
                            </div>
                            <button onclick="deleteCartItem(${i.cartItemId})" title="حذف الصنف" class="text-red-500 hover:text-red-700 p-1 rounded">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>

                        <!-- إدخال التعديل والملاحظات -->
                        <div>
                            <input type="text" 
                                value="${i.note}" 
                                oninput="updateNote(${i.cartItemId}, this.value)" 
                                placeholder="إضافة ملاحظة (شراك، حار، فرنسي...)" 
                                class="w-full text-xs p-1.5 border border-slate-300 rounded bg-white focus:outline-none focus:border-orange-500" />
                        </div>

                        <div class="flex justify-between items-center pt-1 border-t border-slate-200">
                            <div class="flex items-center gap-2">
                                <button onclick="changeQty(${i.cartItemId}, -1)" class="w-6 h-6 bg-slate-200 text-slate-700 rounded text-xs font-bold hover:bg-slate-300 flex items-center justify-center">-</button>
                                <span class="font-bold text-sm text-slate-800">${i.qty}</span>
                                <button onclick="changeQty(${i.cartItemId}, 1)" class="w-6 h-6 bg-orange-500 text-white rounded text-xs font-bold hover:bg-orange-600 flex items-center justify-center">+</button>
                            </div>
                            <span class="font-bold text-sm text-slate-900">${(i.price * i.qty).toFixed(2)} د.أ</span>
                        </div>
                    </div>
                `).join('');
            }

            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            document.getElementById('total').innerText = total.toFixed(2) + ' د.أ';
        }

        function processPayment() {
            if (cart.length === 0) return alert('السلة فارغة!');
            
            document.getElementById('print-date').innerText = new Date().toLocaleString('ar-JO');
            document.getElementById('print-items').innerHTML = cart.map(i => `
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 4px 0; font-size:11px;">
                        <div><strong>${i.name}</strong></div>
                        ${i.note ? `<div style="font-size:10px; color:#555;">ملاحظات: (${i.note})</div>` : ''}
                    </td>
                    <td style="text-align: center; font-size:11px;">${i.qty}</td>
                    <td style="text-align: left; font-size:11px;">${(i.price * i.qty).toFixed(2)}</td>
                </tr>
            `).join('');

            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            document.getElementById('print-total').innerText = total.toFixed(2);

            window.print();
        }

        renderCategories();
        renderProducts();
    </script>
</body>
</html>
